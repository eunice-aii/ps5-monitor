name: PS5 監控

on:
  schedule:
    - cron: "17 * * * *"      # 備援：每小時叫醒一次（萬一接力斷掉）
  workflow_dispatch:           # 手動執行／接力用

concurrency:
  group: ps5-monitor
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 監控（每 60 秒查一次，連續跑約 5 小時 40 分）
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MAX_PRICE: "22000"
        run: python ps5_monitor.py --duration 20400
      - name: 儲存通知紀錄（避免重複通知）
        if: always()
        run: |
          git config user.name "ps5-bot"
          git config user.email "ps5-bot@users.noreply.github.com"
          git add ps5_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "更新狀態" && git pull --rebase -q && git push)
      - name: 接力：啟動下一輪
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref main -R ${{ github.repository }}
