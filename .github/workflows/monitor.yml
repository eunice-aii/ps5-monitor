name: PS5 監控

on:
  schedule:
    - cron: "*/5 * * * *"     # 每 5 分鐘啟動一次（GitHub 可能延遲幾分鐘）
  workflow_dispatch:           # 可手動執行

concurrency:
  group: ps5-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 監控（每 60 秒查一次，跑約 4.5 分鐘）
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MAX_PRICE: "22000"
        run: python ps5_monitor.py --duration 270
      - name: 儲存通知紀錄（避免重複通知）
        run: |
          git config user.name "ps5-bot"
          git config user.email "ps5-bot@users.noreply.github.com"
          git add ps5_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "更新狀態" && git push)
